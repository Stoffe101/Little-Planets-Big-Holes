name: tests

on:
  push:
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -o godot.zip
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --headless --version
      - name: Import project
        run: godot --headless --path . --import
      - name: Compile check
        run: |
          out="$(godot --headless --path . res://tools/dev/check.tscn 2>&1)"
          echo "$out"
          echo "$out" | grep -q "check complete, failures=0"
      - name: Run tests
        run: godot --headless --path . res://tests/run_tests.tscn
